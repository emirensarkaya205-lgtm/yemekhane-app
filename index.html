<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kampüs Yemekhanesi</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex justify-center selection:bg-blue-500">

  <div class="w-full max-w-md p-4 pb-12 space-y-4">
    <!-- Üst Başlık -->
    <header class="bg-slate-800/90 backdrop-blur-md p-5 rounded-3xl border border-slate-700/60 shadow-xl flex justify-between items-center">
      <div>
        <span class="text-xs font-bold tracking-wider text-blue-400 uppercase">Kampüs Menüsü</span>
        <h1 id="date-label" class="text-lg font-bold text-white">Yükleniyor...</h1>
      </div>
      <div id="calorie-badge" class="px-3.5 py-1.5 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-400 font-bold text-xs">
        -- kcal
      </div>
    </header>

    <!-- Yemek Listesi -->
    <main class="space-y-2.5" id="food-container">
      <div class="h-16 bg-slate-800/60 rounded-2xl animate-pulse"></div>
      <div class="h-16 bg-slate-800/60 rounded-2xl animate-pulse"></div>
      <div class="h-16 bg-slate-800/60 rounded-2xl animate-pulse"></div>
      <div class="h-16 bg-slate-800/60 rounded-2xl animate-pulse"></div>
    </main>

    <!-- Canlı Sıra Durumu -->
    <section class="bg-slate-800/80 p-5 rounded-3xl border border-slate-700/60 space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-semibold text-slate-200">Canlı Sıra Durumu</h2>
        <span id="crowd-status" class="text-xs px-2.5 py-1 rounded-full font-medium bg-slate-700 text-slate-300">Yükleniyor</span>
      </div>
      <div class="grid grid-cols-3 gap-2">
        <button onclick="setCrowd('Sıra Yok')" class="py-2.5 rounded-xl bg-slate-700/50 hover:bg-slate-700 border border-slate-600 text-xs font-medium transition active:scale-95">Sıra Yok</button>
        <button onclick="setCrowd('Normal')" class="py-2.5 rounded-xl bg-slate-700/50 hover:bg-slate-700 border border-slate-600 text-xs font-medium transition active:scale-95">Normal</button>
        <button onclick="setCrowd('Çok Sıra')" class="py-2.5 rounded-xl bg-slate-700/50 hover:bg-slate-700 border border-slate-600 text-xs font-medium transition active:scale-95">Çok Sıra</button>
      </div>
    </section>

    <!-- Menüyü Puanla -->
    <section class="bg-slate-800/80 p-5 rounded-3xl border border-slate-700/60 text-center space-y-3">
      <p class="text-sm font-medium text-slate-300">Bugünkü Menü Nasıldı?</p>
      <div class="flex justify-center space-x-3 text-3xl text-slate-600" id="star-box">
        <button onclick="giveRate(1)" class="hover:scale-125 transition">★</button>
        <button onclick="giveRate(2)" class="hover:scale-125 transition">★</button>
        <button onclick="giveRate(3)" class="hover:scale-125 transition">★</button>
        <button onclick="giveRate(4)" class="hover:scale-125 transition">★</button>
        <button onclick="giveRate(5)" class="hover:scale-125 transition">★</button>
      </div>
      <p id="rate-result" class="text-xs text-slate-400">Ortalama: -- (0 oy)</p>
    </section>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    fetch('./data/menu.json?cache_bust=' + Date.now())
      .then(res => res.json())
      .then(data => {
        document.getElementById('date-label').innerText = data.date + ' • ' + data.meal_type;
        document.getElementById('calorie-badge').innerText = data.total_calories + ' kcal';

        const container = document.getElementById('food-container');
        container.innerHTML = '';

        data.foods.forEach(f => {
          const item = document.createElement('div');
          item.className = 'flex justify-between items-center p-4 bg-slate-800/60 rounded-2xl border border-slate-700/40 shadow-sm';
          item.innerHTML = `
            <div class="flex items-center space-x-3">
              <div class="w-10 h-10 rounded-xl bg-blue-500/10 text-blue-400 flex items-center justify-center font-bold">🥣</div>
              <span class="font-medium text-sm text-slate-200">${f.name}</span>
            </div>
            <span class="text-xs font-semibold text-slate-400">${f.calories} kcal</span>
          `;
          container.appendChild(item);
        });

        if (data.stats) {
          updateCrowdUI(data.stats.crowd);
          document.getElementById('rate-result').innerText = `Ortalama: ${data.stats.rating_average} ⭐ (${data.stats.rating_count} oy)`;
        }
      })
      .catch(() => {
        document.getElementById('food-container').innerHTML = '<p class="text-center text-sm text-slate-500 py-6">Menü verisine ulaşılamadı.</p>';
      });

    function updateCrowdUI(status) {
      const badge = document.getElementById('crowd-status');
      badge.innerText = status;
      badge.className = 'text-xs px-2.5 py-1 rounded-full font-medium ' + 
        (status === 'Sıra Yok' ? 'bg-emerald-500/20 text-emerald-400' :
         status === 'Normal' ? 'bg-amber-500/20 text-amber-400' : 'bg-rose-500/20 text-rose-400');
    }

    function setCrowd(val) {
      updateCrowdUI(val);
      localStorage.setItem('my_crowd_vote', val);
      alert('Sıra durumu iletildi: ' + val);
    }

    function giveRate(score) {
      const stars = document.getElementById('star-box').children;
      for (let i = 0; i < 5; i++) {
        stars[i].style.color = i < score ? '#fbbf24' : '#475569';
      }
      localStorage.setItem('my_menu_rate', score);
      alert(score + ' Yıldız verdiniz! Oyunuz kaydedildi.');
    }
  </script>
</body>
</html>
